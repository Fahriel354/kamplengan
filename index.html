<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tampar Tangan 2D - GitHub Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 500px;
      border: 4px solid #fff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
    }
    .ui-overlay.hidden {
      display: none;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff0055;
    }
    .btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 12px 24px;
      margin: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:hover {
      background: #ff3300;
      transform: scale(1.05);
    }
    .controls-hint {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Overlay Menu / Game Over -->
    <div id="uiOverlay" class="ui-overlay">
      <h1 id="menuTitle">TAMPAR TANGAN</h1>
      <div id="menuButtons">
        <button class="btn" onclick="startGame('vs_cpu')">1 Player (vs Computer)</button>
        <button class="btn" onclick="startGame('2p')">2 Players (Lokal)</button>
      </div>
      <div class="controls-hint" id="controlsHint">
        <b>Pemain 1 (Kiri):</b> Tekan <b>[ W ]</b> untuk Tampar/Mengecilkan Tangan<br>
        <b>Pemain 2 / CPU (Kanan):</b> Tekan <b>[ PANAH ATAS ]</b> untuk Menghindar/Tampar
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('uiOverlay');
    const menuTitle = document.getElementById('menuTitle');

    // Web Audio API Synth Engine
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'slap') {
        // Suara Tamparan (Noise + Frequency Drop)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'dodge') {
        // Suara Menghindar (Whoosh)
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // State Game
    let gameMode = 'vs_cpu'; // 'vs_cpu' atau '2p'
    let level = 1;
    let scoreP1 = 0;
    let scoreP2 = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameActive = false;

    // Peran: 'attacker' atau 'defender'
    let p1Role = 'attacker';
    let p2Role = 'defender';

    // Animasi posisi tangan
    let p1Pos = 0; // 0 = normal, 1 = menyerang/menghindar
    let p2Pos = 0;
    let p2Redness = 0; // Kemerahan tangan P2 jika kena tampar
    let p1Redness = 0;

    // Particle Background
    const particles = Array.from({ length: 25 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 3 + 1,
      speed: Math.random() * 1 + 0.5
    }));

    function startGame(mode) {
      gameMode = mode;
      scoreP1 = 0;
      scoreP2 = 0;
      level = 1;
      timeLeft = 30;
      p1Role = 'attacker';
      p2Role = 'defender';
      p1Redness = 0;
      p2Redness = 0;
      gameActive = true;

      uiOverlay.classList.add('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
        } else {
          endGame();
        }
      }, 1000);

      if (gameMode === 'vs_cpu') {
        cpuLogic();
      }
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      playSound('win');
      
      let winner = scoreP1 > scoreP2 ? "PEMAIN 1 MENANG!" : (scoreP2 > scoreP1 ? "PEMAIN 2 / CPU MENANG!" : "SERI!");
      menuTitle.innerText = winner;
      uiOverlay.classList.remove('hidden');
    }

    // Kontrol Input
    window.addEventListener('keydown', (e) => {
      if (!gameActive) return;

      // Pemain 1 Input (Aksi: W)
      if (e.key.toLowerCase() === 'w') {
        handleAction('p1');
      }

      // Pemain 2 Input (Aksi: ArrowUp)
      if (e.key === 'ArrowUp' && gameMode === '2p') {
        handleAction('p2');
      }
    });

    function handleAction(player) {
      if (player === 'p1' && p1Role === 'attacker') {
        p1Pos = 1; // P1 menampar
        playSound('slap');

        // Cek apakah P2 sedang menghindar
        if (p2Pos === 1) {
          // P2 berhasil menghindar!
          playSound('dodge');
          // Tukar Peran
          switchRoles();
        } else {
          // P2 kena tampar!
          scoreP1++;
          p2Redness = Math.min(p2Redness + 0.25, 1);
          if (scoreP1 % 3 === 0) level++; // Naikkkan level tiap 3 poin
        }

        setTimeout(() => { p1Pos = 0; }, 200);

      } else if (player === 'p2' && p2Role === 'attacker') {
        p2Pos = 1; // P2 menampar
        playSound('slap');

        if (p1Pos === 1) {
          // P1 berhasil menghindar!
          playSound('dodge');
          switchRoles();
        } else {
          // P1 kena tampar!
          scoreP2++;
          p1Redness = Math.min(p1Redness + 0.25, 1);
        }

        setTimeout(() => { p2Pos = 0; }, 200);

      } else if (player === 'p1' && p1Role === 'defender') {
        // P1 mencoba menghindar
        p1Pos = 1;
        playSound('dodge');
        setTimeout(() => { p1Pos = 0; }, 300);

      } else if (player === 'p2' && p2Role === 'defender') {
        // P2 mencoba menghindar
        p2Pos = 1;
        playSound('dodge');
        setTimeout(() => { p2Pos = 0; }, 300);
      }
    }

    function switchRoles() {
      let temp = p1Role;
      p1Role = p2Role;
      p2Role = temp;
    }

    // AI Computer Logic
    function cpuLogic() {
      if (!gameActive) return;

      let delay = Math.max(400 - (level * 50), 120); // Makin tinggi level, makin cepat refleks CPU

      setTimeout(() => {
        if (gameActive && gameMode === 'vs_cpu') {
          if (p2Role === 'attacker' && Math.random() < 0.7) {
            handleAction('p2');
          } else if (p2Role === 'defender' && p1Pos === 1) {
            // Refleks CPU saat P1 menyerang
            if (Math.random() < (0.4 + level * 0.1)) {
              handleAction('p2');
            }
          }
        }
        cpuLogic();
      }, delay);
    }

    // Drawing Visuals
    function drawHand(x, y, isLeft, isSlapping, redness) {
      ctx.save();
      ctx.translate(x, y);
      
      // Rotasi tangan saat animasi tampar
      if (isLeft) {
        ctx.rotate(isSlapping ? 0.4 : 0);
      } else {
        ctx.rotate(isSlapping ? -0.4 : 0);
      }

      // Base Hand Color + Kemerahan akibat ditampar
      let redAmount = Math.floor(redness * 180);
      ctx.fillStyle = `rgb(${230}, ${180 - redAmount}, ${150 - redAmount})`;
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 4;

      // Telapak Tangan
      ctx.beginPath();
      ctx.arc(0, 0, 45, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Jari-jari 2D Simple Animated
      for (let i = -2; i <= 2; i++) {
        let angle = (i * 0.25);
        let length = 60 + (i === 0 ? 15 : 0);
        ctx.beginPath();
        ctx.rotate(angle);
        ctx.roundRect(-8, -length, 16, length, 8);
        ctx.fill();
        ctx.stroke();
        ctx.rotate(-angle);
      }

      ctx.restore();
    }

    function renderBackground() {
      // Split BG Diagonal Animator
      let gradLeft = ctx.createLinearGradient(0, 0, 400, 500);
      gradLeft.addColorStop(0, '#1e3c72');
      gradLeft.addColorStop(1, '#2a5298');

      let gradRight = ctx.createLinearGradient(400, 0, 800, 500);
      gradRight.addColorStop(0, '#870000');
      gradRight.addColorStop(1, '#190a05');

      ctx.fillStyle = gradLeft;
      ctx.fillRect(0, 0, 400, 500);

      ctx.fillStyle = gradRight;
      ctx.fillRect(400, 0, 400, 500);

      // Petir Pemisah di tengah
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(400, 0);
      ctx.lineTo(390, 200);
      ctx.lineTo(410, 300);
      ctx.lineTo(400, 500);
      ctx.stroke();

      // Floating Particles
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function renderUI() {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';

      // Status P1
      ctx.textAlign = 'left';
      ctx.fillText(`P1 (${p1Role.toUpperCase()})`, 20, 35);
      ctx.fillText(`Poin: ${scoreP1}`, 20, 65);

      // Status P2 / CPU
      ctx.textAlign = 'right';
      ctx.fillText(`${gameMode === 'vs_cpu' ? 'CPU' : 'P2'} (${p2Role.toUpperCase()})`, 780, 35);
      ctx.fillText(`Poin: ${scoreP2}`, 780, 65);

      // Timer & Level Center HUD
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText(`00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`, 400, 40);
      
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText(`LEVEL ${level}`, 400, 65);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      renderBackground();

      if (gameActive) {
        // Tangan Pemain 1 (Kiri)
        let p1X = p1Role === 'attacker' ? 300 + (p1Pos * 50) : 250 - (p1Pos * 40);
        drawHand(p1X, 280, true, p1Pos === 1 && p1Role === 'attacker', p1Redness);

        // Tangan Pemain 2 / CPU (Kanan)
        let p2X = p2Role === 'attacker' ? 500 - (p2Pos * 50) : 550 + (p2Pos * 40);
        drawHand(p2X, 280, false, p2Pos === 1 && p2Role === 'attacker', p2Redness);
      }

      renderUI();
      requestAnimationFrame(gameLoop);
    }

    // Jalankan Loop Utama Canvas
    gameLoop();
  </script>
</body>
</html>
