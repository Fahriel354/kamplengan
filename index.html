<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Tampar Tangan 2D - HD Landscape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Container Game Landscape */
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      background: #090a0f;
    }

    #canvas-container {
      position: relative;
      flex: 1;
      height: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
      display: block;
    }

    /* Side Touch Controls */
    .side-control {
      width: 15vw;
      max-width: 120px;
      height: 80%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      z-index: 5;
    }

    .touch-btn {
      width: 100%;
      height: 100%;
      max-height: 250px;
      border: none;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      writing-mode: vertical-lr;
      text-orientation: upright;
      letter-spacing: 2px;
    }

    #btnP1 { background: linear-gradient(135deg, #1e3c72, #2a5298); border: 3px solid #4a90e2; }
    #btnP2 { background: linear-gradient(135deg, #870000, #ff4d4d); border: 3px solid #ff6666; }
    .touch-btn:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    /* UI Overlay Menu */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 15, 0.95);
      z-index: 10;
      padding: 20px;
    }
    .ui-overlay.hidden {
      display: none;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      color: #ff3366;
      text-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
    }
    .menu-btn {
      background: #ff3366;
      color: #fff;
      border: none;
      padding: 12px 28px;
      margin: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 250px;
    }
    .controls-hint {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #ccc;
      text-align: center;
    }

    @media screen and (orientation: portrait) {
      #game-wrapper::after {
        content: "🔄 Miringkan HP Anda ke posisi Landscape!";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        color: #ffcc00;
        font-size: 1.3rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        z-index: 99;
      }
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <div class="side-control">
      <button id="btnP1" class="touch-btn">P1</button>
    </div>

    <div id="canvas-container">
      <canvas id="gameCanvas" width="800" height="450"></canvas>

      <div id="uiOverlay" class="ui-overlay">
        <h1 id="menuTitle">TAMPAR TANGAN 2D</h1>
        <button class="menu-btn" onclick="startGame('vs_cpu')">1 Player (vs CPU)</button>
        <button class="menu-btn" onclick="startGame('2p')">2 Players (Berdua)</button>
        <div class="controls-hint">
          <b>Mobile:</b> Miringkan HP, tekan tombol Kiri / Kanan<br>
          <b>PC:</b> P1 = [ W ] | P2 = [ PANAH ATAS ]
        </div>
      </div>
    </div>

    <div class="side-control">
      <button id="btnP2" class="touch-btn">P2</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('uiOverlay');
    const menuTitle = document.getElementById('menuTitle');

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'slap') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.14);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
      } else if (type === 'dodge') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(480, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        osc.frequency.setValueAtTime(783.99, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    // State Game
    let gameMode = 'vs_cpu';
    let level = 1;
    let scoreP1 = 0;
    let scoreP2 = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameActive = false;

    let attacker = 'p1';
    let isActionInProgress = false;

    let p1State = 'idle'; 
    let p2State = 'idle'; 
    let p1Redness = 0;
    let p2Redness = 0;

    let hitEffects = [];

    const particles = Array.from({ length: 25 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 1,
      speed: Math.random() * 0.6 + 0.2
    }));

    function startGame(mode) {
      initAudio();
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      gameMode = mode;
      scoreP1 = 0;
      scoreP2 = 0;
      level = 1;
      timeLeft = 30;
      attacker = 'p1';
      isActionInProgress = false;
      p1State = 'idle';
      p2State = 'idle';
      p1Redness = 0;
      p2Redness = 0;
      hitEffects = [];
      gameActive = true;

      document.getElementById('btnP2').style.visibility = (gameMode === 'vs_cpu') ? 'hidden' : 'visible';

      uiOverlay.classList.add('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
        } else {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      playSound('win');
      
      let winner = scoreP1 > scoreP2 ? "PEMAIN 1 MENANG!" : (scoreP2 > scoreP1 ? (gameMode === 'vs_cpu' ? "CPU MENANG!" : "PEMAIN 2 MENANG!") : "SERI!");
      menuTitle.innerText = winner;
      uiOverlay.classList.remove('hidden');
    }

    function handleP1Input(e) {
      if (e) e.preventDefault();
      if (gameActive && !isActionInProgress) triggerAction('p1');
    }

    function handleP2Input(e) {
      if (e) e.preventDefault();
      if (gameActive && !isActionInProgress && gameMode === '2p') triggerAction('p2');
    }

    const btnP1 = document.getElementById('btnP1');
    const btnP2 = document.getElementById('btnP2');

    btnP1.addEventListener('touchstart', handleP1Input);
    btnP1.addEventListener('mousedown', handleP1Input);

    btnP2.addEventListener('touchstart', handleP2Input);
    btnP2.addEventListener('mousedown', handleP2Input);

    window.addEventListener('keydown', (e) => {
      if (!gameActive || isActionInProgress) return;
      if (e.key.toLowerCase() === 'w') handleP1Input();
      if (e.key === 'ArrowUp') handleP2Input();
    });

    function createHitEffect(x, y) {
      hitEffects.push({ x, y, radius: 10, alpha: 1.0 });
    }

    function triggerAction(player) {
      if (isActionInProgress) return;

      if (player === attacker) {
        isActionInProgress = true;
        if (attacker === 'p1') p1State = 'slapping';
        else p2State = 'slapping';

        if (gameMode === 'vs_cpu' && attacker === 'p1' && p2State === 'idle') {
          let dodgeChance = Math.min(0.3 + (level * 0.12), 0.85);
          if (Math.random() < dodgeChance) {
            p2State = 'dodging';
            playSound('dodge');
          }
        }

        setTimeout(() => {
          let defender = attacker === 'p1' ? 'p2' : 'p1';
          let defenderState = defender === 'p1' ? p1State : p2State;

          if (defenderState === 'dodging') {
            attacker = defender;
          } else {
            playSound('slap');
            if (attacker === 'p1') {
              scoreP1++;
              p2Redness = Math.min(p2Redness + 0.25, 1);
              createHitEffect(500, 250);
              if (scoreP1 % 3 === 0) level++;
            } else {
              scoreP2++;
              p1Redness = Math.min(p1Redness + 0.25, 1);
              createHitEffect(300, 250);
            }
          }

          p1State = 'idle';
          p2State = 'idle';
          isActionInProgress = false;

          if (gameActive && gameMode === 'vs_cpu' && attacker === 'p2') {
            let cpuAttackDelay = Math.max(550 - (level * 55), 180);
            setTimeout(() => {
              if (gameActive && attacker === 'p2' && !isActionInProgress) {
                triggerAction('p2');
              }
            }, cpuAttackDelay);
          }
        }, 180);

      } else {
        if (player === 'p1' && p1State === 'idle') {
          p1State = 'dodging';
          playSound('dodge');
          setTimeout(() => { if (p1State === 'dodging') p1State = 'idle'; }, 350);
        } else if (player === 'p2' && p2State === 'idle') {
          p2State = 'dodging';
          playSound('dodge');
          setTimeout(() => { if (p2State === 'dodging') p2State = 'idle'; }, 350);
        }
      }
    }

    // FUNCTION GAMBAR TANGAN REALISTIS / ANIMASI DETAIL
    function drawDetailedHand(x, y, isLeft, state, redness) {
      ctx.save();
      ctx.translate(x, y);

      let scaleFactor = isLeft ? 1 : -1;
      ctx.scale(scaleFactor, 1);

      let rotation = 0;
      if (state === 'slapping') rotation = 0.45;
      if (state === 'dodging') rotation = -0.5;
      ctx.rotate(rotation);

      // Gradient Warna Kulit & Efek Kemerahan Tamparan
      let r = Math.min(255, 235 + Math.floor(redness * 20));
      let g = Math.max(70, 175 - Math.floor(redness * 125));
      let b = Math.max(70, 140 - Math.floor(redness * 100));

      let skinGrad = ctx.createLinearGradient(-40, -100, 40, 100);
      skinGrad.addColorStop(0, `rgb(${r}, ${g}, ${b})`);
      skinGrad.addColorStop(1, `rgb(${Math.max(0, r - 40)}, ${Math.max(0, g - 40)}, ${Math.max(0, b - 40)})`);

      ctx.fillStyle = skinGrad;
      ctx.strokeStyle = '#1d1310';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Lengan
      ctx.beginPath();
      ctx.moveTo(-35, 180);
      ctx.lineTo(-28, 60);
      ctx.lineTo(32, 60);
      ctx.lineTo(40, 180);
      ctx.fill();
      ctx.stroke();

      // Telapak Tangan
      ctx.beginPath();
      ctx.moveTo(-28, 60);
      ctx.bezierCurveTo(-45, 20, -42, -20, -25, -40); // Sisi luar jempol
      ctx.bezierCurveTo(0, -50, 25, -50, 38, -30);
      ctx.bezierCurveTo(45, 0, 42, 40, 32, 60);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Detail Lipatan Telapak Tangan (Garis-Garis Tangan)
      ctx.strokeStyle = `rgba(100, 30, 20, ${0.3 + redness * 0.3})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-15, -10);
      ctx.quadraticCurveTo(5, 10, 25, 5);
      ctx.moveTo(-20, 15);
      ctx.quadraticCurveTo(0, 30, 20, 25);
      ctx.stroke();

      // Struktur 5 Jari (Ibu jari sampai Kelingking)
      ctx.strokeStyle = '#1d1310';
      ctx.lineWidth = 3.5;
      ctx.fillStyle = skinGrad;

      let fingers = [
        { x: -34, y: -15, w: 16, h: 50, rot: -0.6, nail: true },  // Ibu Jari
        { x: -22, y: -40, w: 15, h: 75, rot: -0.15, nail: false }, // Telunjuk
        { x: -5,  y: -48, w: 16, h: 82, rot: 0,     nail: false }, // Jari Tengah
        { x: 12,  y: -44, w: 15, h: 74, rot: 0.12,  nail: false }, // Jari Manis
        { x: 28,  y: -32, w: 13, h: 60, rot: 0.28,  nail: false }  // Kelingking
      ];

      fingers.forEach(f => {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.rot);

        // Jari
        ctx.beginPath();
        ctx.roundRect(-f.w / 2, -f.h, f.w, f.h, f.w / 2);
        ctx.fill();
        ctx.stroke();

        // Ruas-ruas Jari
        ctx.strokeStyle = `rgba(80, 20, 10, 0.25)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-f.w / 3, -f.h * 0.65);
        ctx.lineTo(f.w / 3, -f.h * 0.65);
        ctx.moveTo(-f.w / 3, -f.h * 0.35);
        ctx.lineTo(f.w / 3, -f.h * 0.35);
        ctx.stroke();

        ctx.restore();
      });

      // Efek Merah Memar di Tengah Telapak Tangan jika sering kena
      if (redness > 0) {
        let spotGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 35);
        spotGrad.addColorStop(0, `rgba(255, 0, 0, ${redness * 0.85})`);
        spotGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
        ctx.fillStyle = spotGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 35, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function renderBackground() {
      let gradLeft = ctx.createLinearGradient(0, 0, 400, 450);
      gradLeft.addColorStop(0, '#111e38');
      gradLeft.addColorStop(1, '#0a0d18');

      let gradRight = ctx.createLinearGradient(400, 0, 800, 450);
      gradRight.addColorStop(0, '#381111');
      gradRight.addColorStop(1, '#180a0a');

      ctx.fillStyle = gradLeft;
      ctx.fillRect(0, 0, 400, 450);

      ctx.fillStyle = gradRight;
      ctx.fillRect(400, 0, 400, 450);

      // Garis Pemisah Petir Glowing
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(400, 0);
      ctx.lineTo(392, 160);
      ctx.lineTo(408, 290);
      ctx.lineTo(400, 450);
      ctx.stroke();
      ctx.shadowBlur = 0; // Reset shadow

      // Particles Background
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function renderEffects() {
      // Animation Effect Tamparan
      for (let i = hitEffects.length - 1; i >= 0; i--) {
        let fx = hitEffects[i];
        ctx.save();
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 230, 100, ${fx.alpha})`;
        ctx.lineWidth = 6;
        ctx.stroke();

        fx.radius += 4;
        fx.alpha -= 0.08;

        if (fx.alpha <= 0) {
          hitEffects.splice(i, 1);
        }
        ctx.restore();
      }
    }

    function renderUI() {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';

      ctx.textAlign = 'left';
      ctx.fillText(`P1 (${attacker === 'p1' ? 'TAMPAR' : 'HINDAR'})`, 25, 35);
      ctx.fillText(`Poin: ${scoreP1}`, 25, 62);

      ctx.textAlign = 'right';
      let p2Name = gameMode === 'vs_cpu' ? 'CPU' : 'P2';
      ctx.fillText(`${p2Name} (${attacker === 'p2' ? 'TAMPAR' : 'HINDAR'})`, 775, 35);
      ctx.fillText(`Poin: ${scoreP2}`, 775, 62);

      ctx.textAlign = 'center';
      ctx.font = 'bold 28px monospace';
      ctx.fillText(`00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`, 400, 40);
      
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText(`LEVEL ${level}`, 400, 65);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      renderBackground();

      if (gameActive) {
        // Render Tangan P1
        let p1X = p1State === 'slapping' ? 330 : (p1State === 'dodging' ? 200 : 250);
        drawDetailedHand(p1X, 260, true, p1State, p1Redness);

        // Render Tangan P2
        let p2X = p2State === 'slapping' ? 470 : (p2State === 'dodging' ? 600 : 550);
        drawDetailedHand(p2X, 260, false, p2State, p2Redness);

        renderEffects();
      }

      renderUI();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
