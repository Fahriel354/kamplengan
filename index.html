<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tampar Tangan 2D - GitHub Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f0f13;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 500px;
      border: 4px solid #fff;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 15, 0.9);
      z-index: 10;
    }
    .ui-overlay.hidden {
      display: none;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ff3366;
      text-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
      text-align: center;
    }
    .btn {
      background: #ff3366;
      color: #fff;
      border: none;
      padding: 14px 28px;
      margin: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(255, 51, 102, 0.4);
    }
    .btn:hover {
      background: #ff5588;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 51, 102, 0.6);
    }
    .controls-hint {
      margin-top: 25px;
      font-size: 0.95rem;
      color: #ccc;
      text-align: center;
      line-height: 1.6;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- UI Overlay Menu -->
    <div id="uiOverlay" class="ui-overlay">
      <h1 id="menuTitle">TAMPAR TANGAN 2D</h1>
      <div id="menuButtons">
        <button class="btn" onclick="startGame('vs_cpu')">1 Player (vs Computer)</button>
        <button class="btn" onclick="startGame('2p')">2 Players (Lokal)</button>
      </div>
      <div class="controls-hint" id="controlsHint">
        <b>Pemain 1 (Kiri):</b> Tekan <b>[ W ]</b> (Menampar / Menghindar)<br>
        <b>Pemain 2 / CPU (Kanan):</b> Tekan <b>[ PANAH ATAS ]</b> (Menampar / Menghindar)
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('uiOverlay');
    const menuTitle = document.getElementById('menuTitle');

    // Web Audio Engine
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'slap') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'dodge') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        osc.frequency.setValueAtTime(783.99, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    // State Game
    let gameMode = 'vs_cpu';
    let level = 1;
    let scoreP1 = 0;
    let scoreP2 = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameActive = false;

    let attacker = 'p1'; // 'p1' atau 'p2'
    let isActionInProgress = false;

    // Animation Variables
    let p1State = 'idle'; // 'idle', 'slapping', 'dodging'
    let p2State = 'idle'; 
    let p1Redness = 0;
    let p2Redness = 0;

    // Background Particle Visuals
    const particles = Array.from({ length: 30 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2.5 + 1,
      speed: Math.random() * 0.8 + 0.3
    }));

    function startGame(mode) {
      gameMode = mode;
      scoreP1 = 0;
      scoreP2 = 0;
      level = 1;
      timeLeft = 30;
      attacker = 'p1';
      isActionInProgress = false;
      p1State = 'idle';
      p2State = 'idle';
      p1Redness = 0;
      p2Redness = 0;
      gameActive = true;

      uiOverlay.classList.add('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
        } else {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      playSound('win');
      
      let winner = scoreP1 > scoreP2 ? "PEMAIN 1 MENANG!" : (scoreP2 > scoreP1 ? (gameMode === 'vs_cpu' ? "CPU MENANG!" : "PEMAIN 2 MENANG!") : "SERI!");
      menuTitle.innerText = winner;
      uiOverlay.classList.remove('hidden');
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
      if (!gameActive || isActionInProgress) return;

      if (e.key.toLowerCase() === 'w') {
        triggerAction('p1');
      } else if (e.key === 'ArrowUp' && gameMode === '2p') {
        triggerAction('p2');
      }
    });

    function triggerAction(player) {
      if (isActionInProgress) return;

      if (player === attacker) {
        // Eksekusi Serangan
        isActionInProgress = true;
        if (attacker === 'p1') p1State = 'slapping';
        else p2State = 'slapping';

        // Jika CPU adalah defender, CPU mencoba refleks menghindar
        if (gameMode === 'vs_cpu' && attacker === 'p1' && p2State === 'idle') {
          let dodgeChance = Math.min(0.35 + (level * 0.12), 0.85);
          if (Math.random() < dodgeChance) {
            p2State = 'dodging';
            playSound('dodge');
          }
        }

        setTimeout(() => {
          let defender = attacker === 'p1' ? 'p2' : 'p1';
          let defenderState = defender === 'p1' ? p1State : p2State;

          if (defenderState === 'dodging') {
            // Menghindar Sukses -> Tukar Peran Penyerang
            attacker = defender;
          } else {
            // Tamparan Kena Target
            playSound('slap');
            if (attacker === 'p1') {
              scoreP1++;
              p2Redness = Math.min(p2Redness + 0.2, 1);
              if (scoreP1 % 3 === 0) level++;
            } else {
              scoreP2++;
              p1Redness = Math.min(p1Redness + 0.2, 1);
            }
          }

          // Reset Posisi
          p1State = 'idle';
          p2State = 'idle';
          isActionInProgress = false;

          // AI CPU Turn Attack Logic
          if (gameActive && gameMode === 'vs_cpu' && attacker === 'p2') {
            let cpuAttackDelay = Math.max(600 - (level * 60), 180);
            setTimeout(() => {
              if (gameActive && attacker === 'p2' && !isActionInProgress) {
                triggerAction('p2');
              }
            }, cpuAttackDelay);
          }
        }, 180);

      } else {
        // Aksi Menghindar Bertahan
        if (player === 'p1' && p1State === 'idle') {
          p1State = 'dodging';
          playSound('dodge');
          setTimeout(() => { if (p1State === 'dodging') p1State = 'idle'; }, 350);
        } else if (player === 'p2' && p2State === 'idle') {
          p2State = 'dodging';
          playSound('dodge');
          setTimeout(() => { if (p2State === 'dodging') p2State = 'idle'; }, 350);
        }
      }
    }

    // Drawing Functions
    function drawHand(x, y, isLeft, state, redness) {
      ctx.save();
      ctx.translate(x, y);

      let rotation = 0;
      if (isLeft) {
        if (state === 'slapping') rotation = 0.45;
        if (state === 'dodging') rotation = -0.45;
      } else {
        if (state === 'slapping') rotation = -0.45;
        if (state === 'dodging') rotation = 0.45;
      }
      ctx.rotate(rotation);

      // Warna Kulit Dinamis (Makin merah jika sering terkena tamparan)
      let redVal = Math.floor(redness * 160);
      ctx.fillStyle = `rgb(240, ${185 - redVal}, ${150 - redVal})`;
      ctx.strokeStyle = '#1b1b1b';
      ctx.lineWidth = 4;

      // Telapak Tangan
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Jari-jari
      for (let i = -2; i <= 2; i++) {
        let angle = i * 0.26;
        let len = 58 + (i === 0 ? 12 : 0);
        ctx.beginPath();
        ctx.rotate(angle);
        ctx.roundRect(-7, -len, 14, len, 7);
        ctx.fill();
        ctx.stroke();
        ctx.rotate(-angle);
      }

      ctx.restore();
    }

    function renderBackground() {
      let gradLeft = ctx.createLinearGradient(0, 0, 400, 500);
      gradLeft.addColorStop(0, '#1a2a6c');
      gradLeft.addColorStop(1, '#270000');

      let gradRight = ctx.createLinearGradient(400, 0, 800, 500);
      gradRight.addColorStop(0, '#b21f1f');
      gradRight.addColorStop(1, '#1a0000');

      ctx.fillStyle = gradLeft;
      ctx.fillRect(0, 0, 400, 500);

      ctx.fillStyle = gradRight;
      ctx.fillRect(400, 0, 400, 500);

      // Garis Pemisah Petir
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(400, 0);
      ctx.lineTo(392, 180);
      ctx.lineTo(408, 320);
      ctx.lineTo(400, 500);
      ctx.stroke();

      // Ambient Floating Particles
      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function renderUI() {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';

      // Status P1
      ctx.textAlign = 'left';
      ctx.fillText(`P1 (${attacker === 'p1' ? 'TAMPAR' : 'HINDAR'})`, 25, 35);
      ctx.fillText(`Poin: ${scoreP1}`, 25, 62);

      // Status P2 / CPU
      ctx.textAlign = 'right';
      let p2Name = gameMode === 'vs_cpu' ? 'CPU' : 'P2';
      ctx.fillText(`${p2Name} (${attacker === 'p2' ? 'TAMPAR' : 'HINDAR'})`, 775, 35);
      ctx.fillText(`Poin: ${scoreP2}`, 775, 62);

      // Status Tengah (Timer & Level)
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px monospace';
      ctx.fillText(`00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`, 400, 40);
      
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText(`LEVEL ${level}`, 400, 65);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      renderBackground();

      if (gameActive) {
        // Tangan Pemain 1 (Kiri)
        let p1X = p1State === 'slapping' ? 330 : (p1State === 'dodging' ? 210 : 260);
        drawHand(p1X, 280, true, p1State, p1Redness);

        // Tangan Pemain 2 / CPU (Kanan)
        let p2X = p2State === 'slapping' ? 470 : (p2State === 'dodging' ? 590 : 540);
        drawHand(p2X, 280, false, p2State, p2Redness);
      }

      renderUI();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
