<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Game Tampar Tangan 2D - Mobile & PC</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: #0f0f13;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 800px;
      height: 60vh;
      max-height: 500px;
      border: 2px solid #555;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    /* Touch Controls UI untuk HP */
    .mobile-controls {
      display: flex;
      justify-content: space-between;
      width: 100vw;
      max-width: 800px;
      margin-top: 15px;
      padding: 0 10px;
    }
    .touch-btn {
      flex: 1;
      height: 70px;
      margin: 0 8px;
      border: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      active: scale(0.95);
    }
    #btnP1 { background: #1e3c72; border: 2px solid #4a90e2; }
    #btnP2 { background: #870000; border: 2px solid #ff4d4d; }
    .touch-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    /* UI Overlay Menu */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 15, 0.92);
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    .ui-overlay.hidden {
      display: none;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      text-transform: uppercase;
      color: #ff3366;
      text-shadow: 0 0 12px rgba(255, 51, 102, 0.6);
    }
    .menu-btn {
      background: #ff3366;
      color: #fff;
      border: none;
      padding: 12px 24px;
      margin: 8px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 80%;
      max-width: 280px;
    }
    .controls-hint {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #ccc;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Overlay Menu -->
    <div id="uiOverlay" class="ui-overlay">
      <h1 id="menuTitle">TAMPAR TANGAN 2D</h1>
      <button class="menu-btn" onclick="startGame('vs_cpu')">1 Player (vs CPU)</button>
      <button class="menu-btn" onclick="startGame('2p')">2 Players (1 HP Berdua)</button>
      <div class="controls-hint">
        <b>Kontrol HP:</b> Tekan Tombol di Bawah Layar<br>
        <b>Kontrol PC:</b> P1 = [ W ] | P2 = [ PANAH ATAS ]
      </div>
    </div>
  </div>

  <!-- Tombol Sentuh / Touch Controls untuk HP -->
  <div class="mobile-controls">
    <button id="btnP1" class="touch-btn">P1 (KIRI)</button>
    <button id="btnP2" class="touch-btn">P2 (KANAN)</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('uiOverlay');
    const menuTitle = document.getElementById('menuTitle');

    // Web Audio Engine (Compatible HP & Desktop)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'slap') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
        gain.gain.setValueAtTime(1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'dodge') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        osc.frequency.setValueAtTime(783.99, now + 0.3);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    // State Game
    let gameMode = 'vs_cpu';
    let level = 1;
    let scoreP1 = 0;
    let scoreP2 = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let gameActive = false;

    let attacker = 'p1';
    let isActionInProgress = false;

    let p1State = 'idle'; 
    let p2State = 'idle'; 
    let p1Redness = 0;
    let p2Redness = 0;

    const particles = Array.from({ length: 20 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2.5 + 1,
      speed: Math.random() * 0.8 + 0.3
    }));

    function startGame(mode) {
      initAudio();
      gameMode = mode;
      scoreP1 = 0;
      scoreP2 = 0;
      level = 1;
      timeLeft = 30;
      attacker = 'p1';
      isActionInProgress = false;
      p1State = 'idle';
      p2State = 'idle';
      p1Redness = 0;
      p2Redness = 0;
      gameActive = true;

      document.getElementById('btnP2').style.display = (gameMode === 'vs_cpu') ? 'none' : 'block';

      uiOverlay.classList.add('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
        } else {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      playSound('win');
      
      let winner = scoreP1 > scoreP2 ? "PEMAIN 1 MENANG!" : (scoreP2 > scoreP1 ? (gameMode === 'vs_cpu' ? "CPU MENANG!" : "PEMAIN 2 MENANG!") : "SERI!");
      menuTitle.innerText = winner;
      uiOverlay.classList.remove('hidden');
    }

    // Input Handlers (Support Touch HP & Keyboard PC)
    function handleP1Input(e) {
      if (e) e.preventDefault();
      if (gameActive && !isActionInProgress) triggerAction('p1');
    }

    function handleP2Input(e) {
      if (e) e.preventDefault();
      if (gameActive && !isActionInProgress && gameMode === '2p') triggerAction('p2');
    }

    // Touch events
    const btnP1 = document.getElementById('btnP1');
    const btnP2 = document.getElementById('btnP2');

    btnP1.addEventListener('touchstart', handleP1Input);
    btnP1.addEventListener('mousedown', handleP1Input);

    btnP2.addEventListener('touchstart', handleP2Input);
    btnP2.addEventListener('mousedown', handleP2Input);

    // Keyboard events
    window.addEventListener('keydown', (e) => {
      if (!gameActive || isActionInProgress) return;
      if (e.key.toLowerCase() === 'w') handleP1Input();
      if (e.key === 'ArrowUp') handleP2Input();
    });

    function triggerAction(player) {
      if (isActionInProgress) return;

      if (player === attacker) {
        isActionInProgress = true;
        if (attacker === 'p1') p1State = 'slapping';
        else p2State = 'slapping';

        // AI Refleks
        if (gameMode === 'vs_cpu' && attacker === 'p1' && p2State === 'idle') {
          let dodgeChance = Math.min(0.3 + (level * 0.12), 0.85);
          if (Math.random() < dodgeChance) {
            p2State = 'dodging';
            playSound('dodge');
          }
        }

        setTimeout(() => {
          let defender = attacker === 'p1' ? 'p2' : 'p1';
          let defenderState = defender === 'p1' ? p1State : p2State;

          if (defenderState === 'dodging') {
            attacker = defender;
          } else {
            playSound('slap');
            if (attacker === 'p1') {
              scoreP1++;
              p2Redness = Math.min(p2Redness + 0.2, 1);
              if (scoreP1 % 3 === 0) level++;
            } else {
              scoreP2++;
              p1Redness = Math.min(p1Redness + 0.2, 1);
            }
          }

          p1State = 'idle';
          p2State = 'idle';
          isActionInProgress = false;

          // CPU Attack Logic
          if (gameActive && gameMode === 'vs_cpu' && attacker === 'p2') {
            let cpuAttackDelay = Math.max(550 - (level * 55), 180);
            setTimeout(() => {
              if (gameActive && attacker === 'p2' && !isActionInProgress) {
                triggerAction('p2');
              }
            }, cpuAttackDelay);
          }
        }, 180);

      } else {
        // Dodging Action
        if (player === 'p1' && p1State === 'idle') {
          p1State = 'dodging';
          playSound('dodge');
          setTimeout(() => { if (p1State === 'dodging') p1State = 'idle'; }, 350);
        } else if (player === 'p2' && p2State === 'idle') {
          p2State = 'dodging';
          playSound('dodge');
          setTimeout(() => { if (p2State === 'dodging') p2State = 'idle'; }, 350);
        }
      }
    }

    // Drawing Visuals
    function drawHand(x, y, isLeft, state, redness) {
      ctx.save();
      ctx.translate(x, y);

      let rotation = 0;
      if (isLeft) {
        if (state === 'slapping') rotation = 0.45;
        if (state === 'dodging') rotation = -0.45;
      } else {
        if (state === 'slapping') rotation = -0.45;
        if (state === 'dodging') rotation = 0.45;
      }
      ctx.rotate(rotation);

      let redVal = Math.floor(redness * 160);
      ctx.fillStyle = `rgb(240, ${185 - redVal}, ${150 - redVal})`;
      ctx.strokeStyle = '#1b1b1b';
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      for (let i = -2; i <= 2; i++) {
        let angle = i * 0.26;
        let len = 58 + (i === 0 ? 12 : 0);
        ctx.beginPath();
        ctx.rotate(angle);
        ctx.roundRect(-7, -len, 14, len, 7);
        ctx.fill();
        ctx.stroke();
        ctx.rotate(-angle);
      }

      ctx.restore();
    }

    function renderBackground() {
      let gradLeft = ctx.createLinearGradient(0, 0, 400, 500);
      gradLeft.addColorStop(0, '#1a2a6c');
      gradLeft.addColorStop(1, '#270000');

      let gradRight = ctx.createLinearGradient(400, 0, 800, 500);
      gradRight.addColorStop(0, '#b21f1f');
      gradRight.addColorStop(1, '#1a0000');

      ctx.fillStyle = gradLeft;
      ctx.fillRect(0, 0, 400, 500);

      ctx.fillStyle = gradRight;
      ctx.fillRect(400, 0, 400, 500);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(400, 0);
      ctx.lineTo(392, 180);
      ctx.lineTo(408, 320);
      ctx.lineTo(400, 500);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function renderUI() {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px sans-serif';

      ctx.textAlign = 'left';
      ctx.fillText(`P1 (${attacker === 'p1' ? 'TAMPAR' : 'HINDAR'})`, 25, 35);
      ctx.fillText(`Poin: ${scoreP1}`, 25, 62);

      ctx.textAlign = 'right';
      let p2Name = gameMode === 'vs_cpu' ? 'CPU' : 'P2';
      ctx.fillText(`${p2Name} (${attacker === 'p2' ? 'TAMPAR' : 'HINDAR'})`, 775, 35);
      ctx.fillText(`Poin: ${scoreP2}`, 775, 62);

      ctx.textAlign = 'center';
      ctx.font = 'bold 28px monospace';
      ctx.fillText(`00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`, 400, 40);
      
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText(`LEVEL ${level}`, 400, 65);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      renderBackground();

      if (gameActive) {
        let p1X = p1State === 'slapping' ? 330 : (p1State === 'dodging' ? 210 : 260);
        drawHand(p1X, 280, true, p1State, p1Redness);

        let p2X = p2State === 'slapping' ? 470 : (p2State === 'dodging' ? 590 : 540);
        drawHand(p2X, 280, false, p2State, p2Redness);
      }

      renderUI();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
