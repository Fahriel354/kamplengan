<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#111e38"/>
      <stop offset="100%" stop-color="#180a0a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="handRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="handTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="burstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffee58" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffee58" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="400" rx="28" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="400" height="400" rx="28" fill="#111e38" opacity="0.35"/>
  <rect x="400" y="0" width="400" height="400" rx="28" fill="#381111" opacity="0.35"/>

  <!-- Center divider glow -->
  <line x1="400" y1="20" x2="400" y2="380" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Impact burst glow behind title -->
  <circle cx="400" cy="150" r="230" fill="url(#burstGlow)"/>

  <!-- Comic burst star -->
  <g filter="url(#softShadow)">
    <path d="M400 40 L420 95 L478 78 L452 132 L512 140 L458 172 L494 220 L432 202 L420 262 L392 208 L336 232 L354 176 L296 158 L350 128 L326 74 L382 100 Z"
          fill="#ffcc00" opacity="0.92"/>
  </g>

  <!-- Left hand (P1, red) -->
  <g transform="translate(230,255) rotate(-18)" filter="url(#softShadow)">
    <path d="M-38 90 L-30 -10 C-33 -40 -20 -66 6 -70 C20 -72 32 -62 34 -46 L36 6
             C46 -6 62 -8 70 4 C76 12 74 24 66 34 L46 58
             C56 50 70 50 76 62 C80 70 76 80 66 88 L36 108 L-38 108 Z"
          fill="url(#handRed)" stroke="#1d1310" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-10 20 Q10 34 34 26 M-16 44 Q6 58 28 50" stroke="#7a1a10" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Right hand (P2, teal) -->
  <g transform="translate(570,255) scale(-1,1) rotate(-18)" filter="url(#softShadow)">
    <path d="M-38 90 L-30 -10 C-33 -40 -20 -66 6 -70 C20 -72 32 -62 34 -46 L36 6
             C46 -6 62 -8 70 4 C76 12 74 24 66 34 L46 58
             C56 50 70 50 76 62 C80 70 76 80 66 88 L36 108 L-38 108 Z"
          fill="url(#handTeal)" stroke="#1d1310" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-10 20 Q10 34 34 26 M-16 44 Q6 58 28 50" stroke="#0d332c" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Impact sparks between hands -->
  <g fill="#ffffff">
    <path d="M400 150 l10 -22 l6 16 l18 -10 l-12 20 l20 4 l-20 6 l14 18 l-20 -10 l-6 18 l-8 -20 l-18 8 l10 -18 l-20 -6 l20 -4 z" opacity="0.9"/>
  </g>

  <!-- Title text -->
  <text x="400" y="330" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-weight="800"
        font-size="66" fill="url(#textGrad)" stroke="#1d1310" stroke-width="2" letter-spacing="2">KAMPLENGAN</text>

  <!-- 2D badge -->
  <g transform="translate(400,362)">
    <rect x="-42" y="-20" width="84" height="34" rx="10" fill="#ff3366" stroke="#1d1310" stroke-width="2.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-weight="800"
          font-size="22" fill="#ffffff" letter-spacing="1">2D</text>
  </g>
</svg>
